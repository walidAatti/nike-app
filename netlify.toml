[build]
  command = "npm run build"
  publish = "dist"

# The app is built with base "/" (for GitHub Pages), but Netlify
# serves the dist folder from the domain root. These rules map the
# / URLs onto the published files.

[[redirects]]
  from = "/"
  to = "/"
  status = 301

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/sneakers.json"
  to = "/sneakers.json"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200

# SPA fallback so client-side routes like /products work on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
